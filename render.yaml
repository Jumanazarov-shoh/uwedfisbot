services:
  - type: web
    name: uwed-fis-bot
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_URL
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: PING_INTERVAL_MINUTES
        value: 5
      - key: NODE_ENV
        value: production
